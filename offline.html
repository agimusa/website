<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline | AGIM</title>
<meta name="theme-color" content="#05060c" />
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#f5f6fb;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(ellipse 60% 50% at 14% -8%,#5b6bd6 0%,transparent 55%),radial-gradient(ellipse 55% 60% at 100% 105%,rgba(91,107,214,.5) 0%,transparent 60%),linear-gradient(160deg,#05060f 0%,#141a35 130%)}
img{width:88px;height:88px;border-radius:50%;box-shadow:0 0 50px 6px rgba(91,107,214,.55);margin-bottom:22px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:40px;margin:0 0 10px}
p{margin:0 auto 24px;max-width:420px;color:rgba(245,246,251,.72);line-height:1.6}
button{font:inherit;font-weight:700;border:0;border-radius:100px;padding:14px 28px;cursor:pointer;color:#05060c;background:linear-gradient(120deg,#8b9bff,#4b57c9)}
</style>
</head>
<body>
<main>
<img src="assets/logo.png" alt="AGIM logo" />
<h1>You're offline</h1>
<p>We can't reach the network right now. Pages you've already opened are still available. Please reconnect to watch live or see the latest updates.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
